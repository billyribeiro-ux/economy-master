"240" stroke="#355d86" stroke-width="2" /><line x1="494.336" y1="220" x2="494.336" y2="240" stroke="#355d86" stroke-width="2" /><circle cx="412.8" cy="230" r="6" fill="#ad253c"/><text x="412.8" y="206" text-anchor="middle">112 [104.16, 119.84]</text><text x="340" y="365" text-anchor="middle">Mean level (USD); intervals are not a difference test</text></g></svg>