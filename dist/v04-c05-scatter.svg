oke-width="1" /><line x1="80" y1="300" x2="600" y2="300" stroke="#17263b" stroke-width="1" /><text x="340" y="365" text-anchor="middle">Training hours</text><circle data-group="A" data-x="1" data-y="8" cx="132" cy="204" r="6" fill="#ad253c"/><circle data-group="A" data-x="2" data-y="7" cx="184" cy="216" r="6" fill="#ad253c"/><circle data-group="A" data-x="3" data-y="6" cx="236" cy="228" r="6" fill="#ad253c"/><rect data-group="B" data-x="7" data-y="18" x="438" y="78" width="12" height="12" fill="#355d86"/><rect data-group="B" data-x="8" data-y="17" x="490" y="90" width="12" height="12" fill="#355d86"/><rect data-group="B" data-x="9" data-y="16" x="542" y="102" width="12" height="12" fill="#355d86"/><text x="245" y="53" text-anchor="middle">A: circles   B: squares</text></g></svg>