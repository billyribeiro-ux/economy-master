<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc"><title id="title">Income histogram: area represents share</title><desc id="desc">Eight synthetic annual household incomes. Bin counts 4,3,1 with widths 20,20,40. Heights .025,.01875,.003125; areas .5,.375,.125.</desc><rect width="640" height="380" fill="white"/><g font-family="system-ui, sans-serif" font-size="16" fill="#17263b"><text x="80" y="28" text-anchor="start">Density per thousand USD</text><line x1="80" y1="300" x2="600" y2="300" stroke="#c9d1dd" stroke-width="1" /><text x="69" y="305" text-anchor="end">0</text><line x1="80" y1="220" x2="600" y2="220" stroke="#c9d1dd" stroke-width="1" /><text x="69" y="225" text-anchor="end">0.01</text><line x1="80" y1="140" x2="600" y2="140" stroke="#c9d1dd" stroke-width="1" /><text x="69" y="145" text-anchor="end">0.02</text><line x1="80" y1="60" x2="600" y2="60" stroke="#c9d1dd" stroke-width="1" /><text x="69" y="65" text-anchor="end">0.03</text><line x1="80" y1="300" x2="80" y2="306" stroke="#17263b" stroke-width="1" /><text x="80" y="330" text-anchor="middle">0</text><line x1="210" y1="300" x2="210" y2="306" stroke="#17263b" stroke-width="1" /><text x="210" y="330" text-anchor="middle">20</text><line x1="340" y1="300" x2="340" y2="306" stroke="#17263b" stroke-width="1" /><text x="340" y="330" text-anchor="middle">40</text><line x1="470" y1="300" x2="470" y2="306" stroke="#17263b" stroke-width="1" /><text x="470" y="330" text-anchor="middle">60</text><line x1="600" y1="300" x2="600" y2="306" stroke="#17263b" stroke-width="1" /><text x="600" y="330" text-anchor="middle">80</text><line x1="80" y1="60" x2="80" y2="300" stroke="#17263b" stroke-width="1" /><line x1="80" y1="300" x2="600" y2="300" stroke="#17263b" stroke-width="1" /><text x="340" y="365" text-anchor="middle">Annual income (thousand USD)</text><rect data-count="4" data-density="0.025" x="80" y="100" width="130" height="200" fill="#355d86" fill-opacity="0.8" stroke="white"/><text x="145" y="90" text-anchor="middle">n=4</text><rect data-count="3" data-density="0.01875" x="210" y="150" width="130" height="150" fill="#355d86" fill-opacity="0.8" stroke="white"/><text x="275" y="140" text-anchor="middle">n=3</text><rect data-count="1" data-density="0.003125" x="340" y="275" width="260" height="25" fill="#355d86" fill-opacity="0.8" stroke="white"/><text x="470" y="265" text-anchor="middle">n=1</text></g></svg>